# Fabrica la app de Android (APK de prueba) cada vez que se suben cambios.
# El archivo queda para descargar en la pestaña "Actions" de GitHub, en la
# ejecución más reciente, sección "Artifacts" → "ojo-de-gato-apk".
# Además se publica en la página de descarga fija "prueba" (Releases), que se
# baja sin iniciar sesión: el aviso de versión nueva de la app lleva ahí.
name: App Android (APK de prueba)

on:
  push:
    branches: [main, ccr-92d8eb7c-jnz2xm]
  workflow_dispatch:

# Leer el código y publicar la página de descarga "prueba".
permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Instalar librerías
        run: npm ci

      - name: Armar el juego web
        run: npm run build
        env:
          # La app sabe qué versión es (para el aviso de actualización).
          NUMERO_VERSION: ${{ github.run_number }}

      - name: Copiar el juego a la app de Android
        run: npx cap sync android

      - name: Fabricar el APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: ojo-de-gato-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Publicar en la página de descarga "prueba"
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk ojo-de-gato.apk
          gh release delete prueba --yes --cleanup-tag || true
          gh release create prueba ojo-de-gato.apk \
            --title "Versión de prueba ${{ github.run_number }}" \
            --notes "APK de prueba número ${{ github.run_number }}. Se instala encima de la anterior y conserva el progreso." \
            --prerelease --target "${{ github.sha }}"
