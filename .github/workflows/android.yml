# Fabrica la app de Android (APK de prueba) cada vez que se suben cambios.
# El archivo queda para descargar en la pestaña "Actions" de GitHub, en la
# ejecución más reciente, sección "Artifacts" → "ojo-de-gato-apk".
name: App Android (APK de prueba)

on:
  push:
    branches: [main, ccr-92d8eb7c-jnz2xm]
  workflow_dispatch:

# Lo mínimo: el proceso solo puede leer el código, no cambiarlo.
permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Instalar librerías
        run: npm ci

      - name: Armar el juego web
        run: npm run build

      - name: Copiar el juego a la app de Android
        run: npx cap sync android

      - name: Fabricar el APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: ojo-de-gato-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
