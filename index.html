<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0c2422" />
    <title>Ojo de Gato</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,500;0,600;1,700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <canvas id="lienzo"></canvas>

    <div id="hud">
      <div class="hud-arriba">
        <div class="placa marcador" aria-live="polite">
          <div id="marcador-j1" class="marcador-fila"><span class="marcador-punto"></span><span class="marcador-nombre">Jugador 1</span><span class="marcador-puntos">0</span></div>
          <div id="marcador-j2" class="marcador-fila"><span class="marcador-punto"></span><span class="marcador-nombre">Jugador 2</span><span class="marcador-puntos">0</span></div>
          <div id="marcador-quedan" class="marcador-quedan"></div>
        </div>
        <div class="botones-arriba">
          <button id="btn-ajustes" class="placa boton" type="button" aria-expanded="false" aria-controls="panel-ajustes">Ajustar física</button>
          <button id="btn-nueva" class="placa boton" type="button">Nueva partida</button>
        </div>
      </div>

      <section id="panel-ajustes" class="placa panel-ajustes" hidden aria-label="Ajustar física">
        <div class="panel-cabeza">
          <h2>Ajustar física</h2>
          <button id="ajustes-cerrar" class="boton boton-plano" type="button">Cerrar</button>
        </div>
        <div id="ajustes-lista" class="ajustes-lista"></div>
        <p id="ajustes-valores" class="ajustes-valores"></p>
        <div class="panel-pie">
          <button id="ajustes-restablecer" class="boton boton-plano" type="button">Restablecer</button>
          <button id="ajustes-copiar" class="boton boton-claro" type="button">Copiar valores</button>
        </div>
      </section>

      <p id="aviso" class="aviso" role="status" hidden></p>

      <p id="ayuda" class="placa ayuda" hidden>Toca tu bolincha y arrastra hacia atrás para tirar</p>

      <div class="hud-abajo">
        <button id="btn-camara" class="placa boton boton-camara" type="button" aria-pressed="false">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z" /><circle cx="12" cy="13" r="3.5" /></svg>
          <span id="btn-camara-texto">Mover cámara</span>
        </button>
        <div id="fuerza" class="placa fuerza" hidden>
          <span class="fuerza-etiqueta">Fuerza</span>
          <div class="fuerza-barra"><div id="fuerza-relleno" class="fuerza-relleno"></div></div>
          <span id="fuerza-numero" class="fuerza-numero">0 %</span>
        </div>
      </div>
    </div>

    <div id="tarjeta" class="tarjeta-fondo" hidden>
      <div class="tarjeta" role="dialog" aria-modal="true" aria-labelledby="tarjeta-titulo">
        <h2 id="tarjeta-titulo" class="tarjeta-titulo"></h2>
        <p id="tarjeta-subtitulo" class="tarjeta-subtitulo"></p>
        <p id="tarjeta-texto" class="tarjeta-texto"></p>
        <ul id="tarjeta-lista" class="tarjeta-lista"></ul>
        <p id="tarjeta-pregunta" class="tarjeta-pregunta"></p>
        <div id="tarjeta-botones" class="tarjeta-botones"></div>
      </div>
    </div>

    <div id="cargando" class="cargando">
      <p class="cargando-nombre">Ojo de Gato</p>
      <p id="cargando-texto" class="cargando-texto">Preparando el patio…</p>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
