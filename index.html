<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0c2422" />
    <title>Ojo de Gato</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,500;0,600;1,700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <canvas id="lienzo"></canvas>

    <div id="hud">
      <div class="hud-arriba">
        <div class="placa marca"><span class="marca-nombre">Ojo de Gato</span><span class="marca-etapa">Etapa 1 · Prueba de tiro</span></div>
        <button id="btn-reiniciar" class="placa boton" type="button">Reiniciar</button>
      </div>

      <p id="ayuda" class="placa ayuda">Toca tu bolincha y arrastra hacia atrás para tirar</p>

      <div class="hud-abajo">
        <button id="btn-camara" class="placa boton boton-camara" type="button" aria-pressed="false">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z" /><circle cx="12" cy="13" r="3.5" /></svg>
          <span id="btn-camara-texto">Mover cámara</span>
        </button>
        <div id="fuerza" class="placa fuerza" hidden>
          <span class="fuerza-etiqueta">Fuerza</span>
          <div class="fuerza-barra"><div id="fuerza-relleno" class="fuerza-relleno"></div></div>
          <span id="fuerza-numero" class="fuerza-numero">0 %</span>
        </div>
      </div>
    </div>

    <div id="cargando" class="cargando">
      <p class="cargando-nombre">Ojo de Gato</p>
      <p id="cargando-texto" class="cargando-texto">Preparando el patio…</p>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
